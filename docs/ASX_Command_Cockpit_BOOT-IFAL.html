<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PRIME-IFAL v4 — ASX PRIME COMMAND COCKPIT</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --cyan:#00ffff;--lime:#00ff00;--yellow:#ffff00;
      --bg:#000000;--panel:rgba(0,0,0,0.86);--line:rgba(0,255,255,0.6);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;background:var(--bg);color:#0ff;
      font-family:'Orbitron','Courier New',monospace;overflow:hidden;
    }
    #star-field{position:fixed;inset:0;background:#000;z-index:0;}
    .star-layer{position:absolute;inset:0;animation:starScroll 20s linear infinite;}
    @keyframes starScroll{from{transform:translateY(0)}to{transform:translateY(100%)}}
    .star{position:absolute;border-radius:50%;}
    .star.cyan{background:#0ff;box-shadow:0 0 10px #0ff;}
    .star.yellow{background:#ff0;box-shadow:0 0 10px #ff0;}
    .star.white{background:#fff;box-shadow:0 0 6px #fff;}

    .hud-frame{
      position:fixed;inset:40px;border:3px solid var(--line);
      box-shadow:inset 0 0 30px rgba(0,255,255,.3),0 0 30px rgba(0,255,255,.3);
      pointer-events:none;z-index:1;animation:framePulse 3s ease-in-out infinite;
    }
    @keyframes framePulse{
      0%,100%{border-color:rgba(0,255,255,.6)}
      50%{border-color:rgba(0,255,255,.9)}
    }
    .scanlines{
      position:fixed;inset:0;
      background:linear-gradient(transparent 0%,rgba(0,255,255,.04) 50%,transparent 100%);
      background-size:100% 5px;pointer-events:none;z-index:999;
      animation:scanline 10s linear infinite;
    }
    @keyframes scanline{
      0%{background-position:0 0}
      100%{background-position:0 100%}
    }

    .asx-logo{
      position:absolute;top:8%;left:50%;transform:translateX(-50%);
      text-align:center;z-index:2;user-select:none;pointer-events:none;
    }
    .asx-title{
      font-size:90px;font-weight:900;letter-spacing:14px;color:#0ff;
      text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff;
      animation:titlePulse 2s ease-in-out infinite;
    }
    .asx-subtitle{
      font-size:16px;letter-spacing:6px;color:#ff0;
      text-shadow:0 0 10px #ff0,0 0 20px #ff0;margin-top:6px;font-weight:700;
    }
    @keyframes titlePulse{
      0%,100%{text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff}
      50%{text-shadow:0 0 20px #0ff,0 0 40px #0ff,0 0 80px #0ff,0 0 120px #0ff}
    }

    .crosshair{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:70px;height:70px;z-index:2;pointer-events:none;
    }
    .crosshair::before,.crosshair::after{
      content:"";position:absolute;background:#0ff;box-shadow:0 0 8px #0ff;
    }
    .crosshair::before{left:0;right:0;top:50%;height:2px;transform:translateY(-50%);}
    .crosshair::after{top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);}

    .dock{
      position:fixed;left:50%;bottom:7%;transform:translateX(-50%);
      display:grid;grid-template-columns:repeat(3,1fr);gap:16px;z-index:3;
    }
    .btn{
      width:220px;height:80px;
      background:linear-gradient(135deg,rgba(0,255,255,.15),rgba(0,255,0,.1));
      border:3px solid #0ff;color:#0ff;font-size:15px;font-weight:bold;
      cursor:pointer;position:relative;transition:all .25s;
      text-decoration:none;display:flex;align-items:center;justify-content:center;
      flex-direction:column;text-transform:uppercase;letter-spacing:2px;
      clip-path:polygon(15% 0%,100% 0%,85% 100%,0% 100%);
      box-shadow:0 0 25px rgba(0,255,255,.4);
    }
    .btn:hover{
      background:linear-gradient(135deg,rgba(0,255,255,.4),rgba(0,255,0,.3));
      border-color:#0f0;color:#0f0;box-shadow:0 0 50px rgba(0,255,255,.8);
      transform:scale(1.06) translateY(-3px);
    }
    .btn.engage{
      grid-column:1/-1;width:100%;height:110px;font-size:32px;
      background:linear-gradient(135deg,rgba(255,255,0,.25),rgba(0,255,255,.2));
      border-color:#ff0;color:#ff0;
      clip-path:polygon(5% 0%,95% 0%,100% 50%,95% 100%,5% 100%,0% 50%);
      animation:engagePulse 1.6s ease-in-out infinite;
    }
    @keyframes engagePulse{
      0%,100%{box-shadow:0 0 30px rgba(255,255,0,.6);transform:scale(1)}
      50%{box-shadow:0 0 70px rgba(255,255,0,.9);transform:scale(1.02)}
    }

    .overlay{
      position:fixed;inset:80px;z-index:5;display:none;
    }
    .overlay.show{
      display:grid;grid-template-columns:320px 1fr;gap:12px;
    }
    .panel{
      background:var(--panel);border:1px solid rgba(0,255,255,.35);
      border-radius:12px;box-shadow:0 0 24px rgba(0,255,255,.2);
    }
    .stack{display:grid;grid-template-rows:auto 1fr;gap:10px;height:100%;}
    .panel.heads{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 12px;border-bottom:1px solid rgba(0,255,255,.25);
    }
    .title{font-weight:900;letter-spacing:2px;}
    .close{
      appearance:none;border:2px solid #0ff;background:transparent;color:#0ff;
      border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer;
    }
    .scroll{overflow:auto;padding:12px;}
    .term{
      background:#000;color:#0f0;height:260px;overflow:auto;
      border:1px solid #0f0;border-radius:8px;padding:10px;
      font-family:'Courier New',monospace;font-size:13px;
    }
    .tabs{display:flex;gap:8px;flex-wrap:wrap;}
    .tab{
      padding:8px 12px;border:1px solid rgba(0,255,255,.35);border-radius:999px;
      background:rgba(0,255,255,.08);cursor:pointer;font-size:12px;
    }
    .tab.active{background:rgba(255,255,0,.1);border-color:#ff0;color:#ff0;}

    .grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;
    }
    .mini-runtime{
      position:relative;background:#051119;border:1px solid rgba(0,255,255,.25);
      border-radius:12px;overflow:hidden;
    }
    .mini-runtime canvas{
      display:block;width:100%;height:220px;background:#000;
    }
    .mini-hud{
      position:absolute;left:10px;bottom:10px;display:flex;gap:8px;
    }
    .badge{
      border:1px solid rgba(0,255,255,.45);background:rgba(0,255,255,.08);
      padding:4px 8px;border-radius:8px;font-size:11px;
    }
    iframe.guide{width:100%;height:220px;border:none;background:#020;}
    .pdf-wrap{height:500px;}
    .pdf-wrap embed{width:100%;height:100%;border:none;}

    /* PRIME CHAT MODAL */
    #primeModal{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      width:520px;max-width:92%;background:rgba(0,0,0,.92);
      border:2px solid #0ff;border-radius:16px;box-shadow:0 0 36px rgba(0,255,255,.6);
      z-index:6;display:none;
    }
    #primeModalHead{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 14px;border-bottom:1px solid rgba(0,255,255,.4);
    }
    #primeModalBody{padding:10px 14px;max-height:340px;overflow:auto;}
    #primeChatLog{
      background:#000;border:1px solid #0f0;border-radius:8px;padding:8px;
      height:180px;overflow:auto;font-family:'Courier New',monospace;
      font-size:12px;color:#aaffaa;margin-top:8px;margin-bottom:4px;
    }
    #primeChatInput{
      width:100%;background:#001100;color:#aaffaa;
      border:1px solid #004400;border-radius:8px;padding:6px 8px;
      font-family:'Courier New',monospace;
    }
    #primeChatSend{margin-top:6px;float:right;}

    @media(max-width:1200px){
      .overlay.show{grid-template-columns:1fr;}
      .dock{grid-template-columns:1fr;gap:10px;width:90%;}
      .asx-title{font-size:60px;letter-spacing:6px;}
      .hud-frame{inset:20px;}
    }

    /* GPU DEBUG HUD */
    .dbg-layout{display:grid;grid-template-columns:200px 1fr 1fr;gap:10px;height:100%;padding:10px;}
    .dbg-panel{background:#000b16;border:1px solid rgba(0,255,255,.25);border-radius:8px;padding:10px;}
    .dbg-label{font-size:11px;letter-spacing:2px;color:#0ff;margin-bottom:8px;text-transform:uppercase;}
    .slot-row{display:flex;flex-direction:column;gap:6px;}
    .slot-box{
      display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;
      border:1px solid rgba(0,255,255,.2);background:#020c14;font-size:12px;
      transition:background .3s,border-color .3s,box-shadow .3s;
    }
    .slot-box.compute{background:rgba(0,255,80,.12);border-color:#00ff50;box-shadow:0 0 10px rgba(0,255,80,.4);color:#00ff50;}
    .slot-box.load{background:rgba(255,220,0,.1);border-color:#ffdc00;box-shadow:0 0 10px rgba(255,220,0,.3);color:#ffdc00;}
    .slot-box.prefetch{background:rgba(0,150,255,.08);border-color:#0096ff;box-shadow:0 0 6px rgba(0,150,255,.2);color:#0096ff;}
    .slot-box.idle{background:#020c14;border-color:rgba(0,255,255,.15);color:rgba(0,255,255,.35);}
    .slot-name{font-weight:900;font-size:15px;width:20px;}
    .slot-status{font-size:10px;letter-spacing:1px;text-transform:uppercase;}
    .slot-tile{font-size:9px;opacity:.7;margin-left:auto;}
    .dispatch-wrap{display:flex;flex-direction:column;height:100%;}
    .dispatch-bar-bg{
      background:#020c14;border:1px solid rgba(0,255,255,.2);border-radius:6px;
      height:28px;overflow:hidden;margin-bottom:8px;position:relative;
    }
    .dispatch-bar-fill{
      height:100%;width:0%;
      background:linear-gradient(90deg,#00ffaa,#00ccff);
      box-shadow:0 0 12px rgba(0,255,180,.5);
      transition:width .1s linear;
    }
    .dispatch-stats{font-size:11px;color:rgba(0,255,255,.6);display:flex;gap:10px;flex-wrap:wrap;}
    .dispatch-stat{font-size:11px;}
    .dispatch-stat span{color:#0ff;}
    .op-trace{
      flex:1;background:#000;border:1px solid rgba(0,255,0,.2);border-radius:6px;
      overflow-y:auto;padding:6px;font-family:'Courier New',monospace;
      font-size:11px;color:#00dd88;margin-top:8px;min-height:0;
    }
    .op-line{padding:1px 0;border-bottom:1px solid rgba(0,255,0,.06);}
    .op-line .op-ts{color:rgba(0,255,255,.4);margin-right:6px;}
    .op-line .op-code{color:#00ff88;font-weight:bold;margin-right:4px;}
    .op-line .op-detail{color:rgba(0,255,136,.6);}
    .op-line .op-err{color:#ffaa00;margin-left:4px;}
    canvas.dispatch-canvas{width:100%;height:60px;display:block;border-radius:6px;
      border:1px solid rgba(0,255,255,.15);background:#000;margin-bottom:8px;}
  </style>
</head>
<body>
  <!-- Star field + HUD -->
  <div id="star-field"></div>
  <div class="hud-frame"></div>
  <div class="scanlines"></div>

  <div class="asx-logo">
    <div class="asx-title">ASX PRIME</div>
    <div class="asx-subtitle">PRIME-IFAL v4 • XJSON • SCX • K’UHUL • PRIMEOS</div>

  <!-- Cockpit dock -->
  <div class="dock">

      <div class="scroll">

          <button id="testAI" class="close">Test HF</button>
        </div>
      </div>
    </div>

    <!-- Right: active module view -->
    <div class="panel stack">
      <div class="panel heads">
        <div class="title" id="activeTitle">Welcome</div>
        <div class="tabs">
          <button class="close" id="minimize">Min</button>
          <button class="close" id="maximize">Max</button>
        </div>
      </div>
      <div class="scroll" id="activeView"></div>
    </div>
  </div>

  <!-- PRIME OS Chat Modal (NOT HF terminal) -->
  <div id="primeModal">
    <div id="primeModalHead">
      <div class="title">PRIME OS CHAT • K’UHUL REASONER</div>
      <button class="close" id="primeClose">Close</button>
    </div>
    <div id="primeModalBody">
      <div id="primeManualSlot"></div>
      <div id="primeChatLog"></div>
      <input id="primeChatInput" placeholder="Ask PRIME about KLH, XJSON, SCXQ2, K’UHUL, multi-hive, tapes..." />
      <button class="close" id="primeChatSend">Send</button>
    </div>
  </div>

  <!-- PRIME MANUAL MICRO-HTML -->
  <script>
  window.PRIME_MANUAL = `
  <div style="font-family:Orbitron,monospace;color:#0ff;padding:16px;line-height:1.6">
    <h1 style="color:#0ff;text-shadow:0 0 12px #0ff;margin-top:0">PRIME OS — GODMODE MICRO-MANUAL</h1>

    </ol>
    <p>Each shard is its own ASX tape server running XJSON duties + K’UHUL brain.</p>

    <h2 style="color:#0ff">XJSON Master Spec</h2>
    <pre style="color:#0f0;background:#001100;padding:8px;border-radius:6px;font-size:12px">
{
  "type": "panel",
  "@if": "user.isLoggedIn",
  "@then": { "show": "dashboard" },
  "@else": { "show": "login" }
}
    </pre>

    <h2 style="color:#0ff">K’UHUL Reactor Loop</h2>
    <ul>
      <li>HUD animation frames</li>
      <li>Multi-agent loop (nav / eng / ana)</li>
      <li>Event bus &amp; tape mount lifecycle</li>
      <li>Mini-game coexecution (Galactica / Invaders / Pac-lite)</li>
      <li>Window manager transitions</li>
    </ul>

    <h2 style="color:#0ff">ASX Holotape Boot</h2>
    <pre style="color:#0f0;background:#001100;padding:8px;border-radius:6px;font-size:12px">
/tapes/my_tape/cockpit.asxr → mount → run via K’UHUL
    </pre>

    <h2 style="color:#ff0">PRIME Studio Mode</h2>
    <ul>
      <li>File Tree</li>
      <li>Editor (holo-pane)</li>
      <li>Preview Window</li>
      <li>PRIME Compiler (SCX/XJSON)</li>
      <li>Tape Forge</li>
    </ul>

    <h2 style="color:#0ff">PRIME Chat (this modal)</h2>
    <p>This box is the PRIME OS guidance channel, separate from the HF router terminal.</p>
    <p>Use it for explanations, schematics, and OS-level help.</p>

    <h2 style="color:#ff0">Example PRIME Commands (conceptual)</h2>
    <pre style="color:#0f0;background:#001100;padding:8px;border-radius:6px;font-size:12px">

prime.explain("SCX")
prime.map("multi-hive")
prime.load("asxr")

prime.show("studio")

    <h2 style="color:#f0f">END OF PRIME OS MICRO-MANUAL</h2>

  `;
  </script>

  <script>
    // Minimal SCX stub (UTF-8 base64 decode) for any inline content if needed later
    const SCX = {
      decodeUtf8Base64(b64){
        try { return decodeURIComponent(escape(atob(b64 || ""))); }
        catch(e){ return "SCX-DECODE-ERR: " + e.message; }
      }
    };

    // XJSON boot AST for PRIME-IFAL v4
    const XJSON_BOOT = {
      id:"prime.ifal.v4",
      type:"os.cockpit",
      state:{ activeModule:"terminal" },
      modules:{
        terminal:{id:"terminal",title:"HF Terminal",nodeType:"runtime.terminal"},
        games:{id:"games",title:"Mini Runtimes",nodeType:"runtime.canvas.grid"},
        guides:{id:"guides",title:"All Guides",nodeType:"runtime.guides"},
        diagnostics:{id:"diagnostics",title:"Diagnostics",nodeType:"runtime.diag"},
        prime_manual:{id:"prime_manual",title:"PRIME Manual",nodeType:"runtime.prime_manual"},
        gpu_debug:{id:"gpu_debug",title:"GPU DEBUG HUD",nodeType:"runtime.debugger"}
      }
    };

    class KuhulCore {
      constructor(ast){
        this.ast = ast;
        this.state = JSON.parse(JSON.stringify(ast.state||{}));
        this.modules = ast.modules||{};
        this.logEl = document.getElementById("term");
        this.tabsEl = document.getElementById("tabs");
        this.activeTitleEl = document.getElementById("activeTitle");
        this.activeViewEl = document.getElementById("activeView");
        this.overlay = document.getElementById("overlay");
        this.hfTokenInput = document.getElementById("hfKey");
        this.aiInput = document.getElementById("aiInput");

        this.primeModal = document.getElementById("primeModal");
        this.primeManualSlot = document.getElementById("primeManualSlot");
        this.primeChatLog = document.getElementById("primeChatLog");
        this.primeChatInput = document.getElementById("primeChatInput");

        this.init();
      }

      init(){
        this.bootLogs();
        this.initStars();
        this.initDock();
        this.paintTabs();
        this.selectModule(this.state.activeModule || "terminal");
        this.showPrimeModal(); // PRIME OS chat appears at boot
      }

      bootLogs(){
        this.logSys(">>> INIT: K’UHUL-CORE [+PRIMEOS]");
        this.logSys(">>> LOADING: PRIME-IFAL v4 Cockpit");
        this.logSys(">>> MODULES: terminal, games, guides, diagnostics, prime_manual, gpu_debug");
        this.logSys(">>> STATUS: Online — Awaiting Command");
      }
      logSys(msg){
        const p=document.createElement("div");
        p.innerHTML=`<span style="color:#0ff">[K’UHUL]</span> ${msg}`;
        this.logEl.appendChild(p);
        this.logEl.scrollTop=this.logEl.scrollHeight;
      }
      logUser(msg){
        const p=document.createElement("div");
        p.textContent="> "+msg;
        this.logEl.appendChild(p);
        this.logEl.scrollTop=this.logEl.scrollHeight;
      }
      logAI(msg){
        const p=document.createElement("div");
        p.textContent="AI: "+msg;
        this.logEl.appendChild(p);
        this.logEl.scrollTop=this.logEl.scrollHeight;
      }

      initStars(){
        const starField=document.getElementById("star-field");
        for(let layer=0;layer<3;layer++){
          const L=document.createElement("div");
          L.className="star-layer";
          L.style.animationDuration=(20+layer*10)+"s";
          L.style.animationDelay=(layer*-5)+"s";
          const count=100-layer*20;
          for(let i=0;i<count;i++){
            const s=document.createElement("div");
            s.className="star";
            const types=["cyan","yellow","white"];
            s.classList.add(types[(Math.random()*types.length)|0]);
            const size=Math.random()*3+1;
            s.style.width=size+"px";s.style.height=size+"px";
            s.style.left=Math.random()*100+"%";
            s.style.top=Math.random()*100+"%";
            s.style.animationDelay=Math.random()*3+"s";
            s.style.animationDuration=(Math.random()*2+2)+"s";
            L.appendChild(s);
          }
          starField.appendChild(L);
        }
      }

      initDock(){
        const openOverlay = ()=>this.overlay.classList.add("show");
        const bind=(id,mod)=>{
          const el=document.getElementById(id);
          if(!el) return;
          el.onclick=()=>{
            if(id==="btnPrimeChat"){
              this.showPrimeModal();
              return;
            }
            if(id==="btnEngage" || mod){
              openOverlay();

      async handleCrew(text){
        if(!text) return;
        this.logUser(text);
        const [tagRaw,...rest]=text.split(":");
        const tag=(tagRaw||"").trim();
        const content=(rest.join(":")||text).trim();
        const Crew={
          nav:q=>`Navigator: plotting course — "${q}"`,
          eng:q=>`Engineer: rerouting power for "${q}"`,
          ana:q=>`Analyst: running heuristics on "${q}"`
        };
        if(Crew[tag]) this.logSys(Crew[tag](content));

        const token=this.hfTokenInput.value.trim();
        if(token){
          try{
            const out = await this.hfChat(token,[
              {role:"user",content:[{type:"text",text:content}]}
            ]);
            const reply=out?.choices?.[0]?.message?.content?.[0]?.text || JSON.stringify(out);
            this.logAI(reply);
          }catch(e){
            this.logSys("HF error: "+e.message);
          }
        }else{
          // offline echo
          const echo=content.split("").reverse().join("");
          this.logAI(echo+" • [local echo]");
        }
        this.aiInput.value="";
      }

      async testHF(){
        const token=this.hfTokenInput.value.trim();
        if(!token){ this.logSys("Set HF token before testing live chat."); return; }
        const out=await this.hfChat(token,[
          {role:"user",content:[{type:"text",text:"Ping from PRIME-IFAL cockpit."}]}
        ]);
        const reply=out?.choices?.[0]?.message?.content?.[0]?.text || JSON.stringify(out);
        this.logSys("HF ▶ "+reply);
      }

      async hfChat(token,messages){
        const r=await fetch("https://router.huggingface.co/v1/chat/completions",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
          body:JSON.stringify({model:"Qwen/Qwen3-VL-8B-Instruct:novita",messages})
        });
        if(!r.ok) throw new Error("HTTP "+r.status);
        return r.json();
      }

        if(q.includes("klh")) ans="KLH: hive orchestrator routing duties between shards and agents.";
        else if(q.includes("xjson")) ans="XJSON: declarative OS language with AST and @if/@then/@else.";
        else if(q.includes("scx")) ans="SCXQ2: symbolic compression — code & guides as glyphs.";
        else if(q.includes("k'uhul") || q.includes("kuhul")) ans="K’UHUL: execution engine and TPU-OS reactor loop.";
        else if(q.includes("hive")) ans="PRIME-04 multi-hive: dashboard, users, logistics, intel, settings.";
        else if(q.includes("tape")) ans="ASX tapes (.ASX / .ASXR / .ASXTAPE) mount as XJSON trees in K’UHUL.";
        else if(q.includes("studio")) ans="PRIME Studio: file tree + editor + preview + compiler + tape forge.";
        this.appendPrimeLog("PRIME",ans);

      makeGalactica(){
        const cvs=document.createElement("canvas");
        cvs.width=640;cvs.height=220;
        const ctx=cvs.getContext("2d");
        const W=cvs.width,H=cvs.height;
        const state={t:0,last:performance.now(),bul:[],en:[],score:0,px:W/2,cd:0,auto:true};
        for(let i=0;i<10;i++) state.en.push({x:60+i*50,y:80+(i%2)*20,v:50+Math.random()*50});
        (function step(now){
          requestAnimationFrame(step);
          const dt=Math.min(.033,(now-(state.last||now))/1000);
          state.last=now;state.t+=dt;state.cd-=dt;
          if(state.auto && state.cd<=0){
            state.bul.push({x:state.px,y:H-30,v:-300});
            state.cd=.18;
          }
          state.en.forEach(e=>{e.x+=Math.sin(state.t*e.v/50)*.6;});
          state.bul.forEach(b=>b.y+=b.v*dt);
          for(const b of state.bul){
            for(const e of state.en){
              if(Math.abs(b.x-e.x)<14 && Math.abs(b.y-e.y)<12){
                b.hit=true;e.hit=true;state.score+=50;
              }
            }
          }
          state.en=state.en.filter(e=>!e.hit);
          state.bul=state.bul.filter(b=>!b.hit && b.y>-40);

          ctx.fillStyle="#030b12";ctx.fillRect(0,0,W,H);
          ctx.fillStyle="rgba(255,255,255,.35)";
          for(let i=0;i<80;i++){
            const sx=(i*97%W);const sy=(i*53*7+(state.t*60*i))%H;
            ctx.fillRect(sx,sy,2,2);
          }
          ctx.fillStyle="#9ff";
          ctx.beginPath();
          ctx.moveTo(state.px,H-50);
          ctx.lineTo(state.px+12,H-20);
          ctx.lineTo(state.px-12,H-20);
          ctx.closePath();ctx.fill();
          ctx.fillStyle="#ffd37f";
          state.en.forEach(e=>ctx.fillRect(e.x-10,e.y-8,20,16));
          ctx.fillStyle="#fff";
          state.bul.forEach(b=>ctx.fillRect(b.x-2,b.y-6,4,12));
          ctx.fillStyle="#0fa";ctx.font="12px monospace";
          ctx.fillText("Score "+state.score,10,18);
        })(performance.now());
        return this.makeCard("Galactica",cvs);
      }

      makeInvaders(){
        const cvs=document.createElement("canvas");
        cvs.width=640;cvs.height=220;
        const ctx=cvs.getContext("2d");
        const W=cvs.width,H=cvs.height;
        const state={t:0,last:performance.now(),ship:{x:W/2},en:[],dx:1,bul:[],auto:true,cd:0,score:0};
        for(let r=0;r<3;r++) for(let c=0;c<10;c++) state.en.push({x:60+c*45,y:50+r*24});
        (function step(now){
          requestAnimationFrame(step);
          const dt=Math.min(.033,(now-(state.last||now))/1000);
          state.last=now;state.t+=dt;state.cd-=dt;
          let edge=false;
          state.en.forEach(e=>{
            e.x+=state.dx*40*dt;
            if(e.x<20||e.x>W-20) edge=true;
          });
          if(edge){ state.dx*=-1; state.en.forEach(e=>e.y+=6); }
          if(state.auto && state.cd<=0){
            state.bul.push({x:state.ship.x,y:H-30,v:-260});
            state.cd=.22;
          }
          state.bul.forEach(b=>b.y+=b.v*dt);
          for(const b of state.bul){
            for(const e of state.en){
              if(Math.abs(b.x-e.x)<10 && Math.abs(b.y-e.y)<10){
                b.hit=true;e.hit=true;state.score+=25;
              }
            }
          }
          state.en=state.en.filter(e=>!e.hit);
          state.bul=state.bul.filter(b=>!b.hit && b.y>-40);
          ctx.fillStyle="#01070d";ctx.fillRect(0,0,W,H);
          ctx.fillStyle="#7fd3ff";
          ctx.fillRect(state.ship.x-12,H-28,24,18);
          ctx.fillStyle="#ffcc7a";
          state.en.forEach(e=>ctx.fillRect(e.x-8,e.y-6,16,12));
          ctx.fillStyle="#fff";
          state.bul.forEach(b=>ctx.fillRect(b.x-2,b.y-6,4,12));
          ctx.fillStyle="#0fa";ctx.font="12px monospace";
          ctx.fillText("Score "+state.score,10,18);
        })(performance.now());
        return this.makeCard("Space Invaders (lite)",cvs);
      }

      makePacman(){
        const cvs=document.createElement("canvas");
        cvs.width=640;cvs.height=220;
        const ctx=cvs.getContext("2d");
        const W=cvs.width,H=cvs.height;
        const grid=20,cols=(W/grid)|0,rows=(H/grid)|0;
        const dots=new Set();
        for(let y=2;y<rows-2;y++){
          for(let x=2;x<cols-2;x++){
            if((x+y)%2===0) dots.add(x+","+y);
          }
        }
        const state={t:0,last:performance.now(),px:3,py:3,vx:1,vy:0,score:0};
        (function step(now){
          requestAnimationFrame(step);
          const dt=Math.min(.033,(now-(state.last||now))/1000);
          state.last=now;state.t+=dt;
          if(((state.t*5)|0)%1===0){
            state.px+=state.vx;state.py+=state.vy;
            if(state.px<2) state.px=cols-3;
            if(state.px>cols-3) state.px=2;
            const key=state.px+","+state.py;
            if(dots.has(key)){dots.delete(key);state.score+=10;}
            if(Math.random()<.2){
              const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
              const d=dirs[(Math.random()*4)|0];
              state.vx=d[0];state.vy=d[1];
            }
          }
          ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
          ctx.strokeStyle="#0af";ctx.lineWidth=1;
          for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
          for(let y=0;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
          ctx.fillStyle="#ff0";
          dots.forEach(k=>{
            const [x,y]=k.split(",").map(Number);
            ctx.fillRect(x*grid+grid/2-2,y*grid+grid/2-2,4,4);
          });
          const px=state.px*grid+grid/2;const py=state.py*grid+grid/2;
          ctx.fillStyle="#ff6fd8";ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
          ctx.fillStyle="#0fa";ctx.font="12px monospace";
          ctx.fillText("Score "+state.score,10,18);
        })(performance.now());
        return this.makeCard("Ms. Pac-Man (lite)",cvs);
      }

          fusedBtn.style.background=demoFused?"rgba(255,0,255,.18)":"rgba(0,255,255,.08)";
        };

        // ── MAIN 3-COL LAYOUT ──────────────────────────────────────────────────
        const layout=document.createElement("div");
        layout.style.cssText="display:grid;grid-template-columns:200px 1fr 1fr;gap:8px;"+
          "flex:1;min-height:0;padding:8px;overflow:hidden;";

        // ═══════════════════════════════════════════════
        // COL 1: Tile Flow Canvas
        // ═══════════════════════════════════════════════
        const col1=document.createElement("div");
        col1.className="dbg-panel";
        col1.style.cssText="overflow:hidden;display:flex;flex-direction:column;";
        col1.innerHTML=`<div class="dbg-label">TILE FLOW</div>`;
        const flowCvs=document.createElement("canvas");
        flowCvs.width=200;flowCvs.height=280;
        flowCvs.style.cssText="width:100%;flex:1;";
        col1.appendChild(flowCvs);
        const fc=flowCvs.getContext("2d");

        const slotState={A:{state:"idle",tile:""},B:{state:"idle",tile:""},C:{state:"idle",tile:""}};
        const SY={A:50,B:140,C:230}; // y-centers for slots
        const SX=100;
        const SCOL={compute:"#00ff50",load:"#ffdc00",prefetch:"#0096ff",idle:"rgba(0,255,255,.18)"};
        const tileAnims=[];

        function setSlot(n,state,tile){
          if(!slotState[n]) return;
          slotState[n].state=state; slotState[n].tile=tile||"";
        }

        function drawFlowCanvas(){
          const W=flowCvs.width,H=flowCvs.height;
          fc.fillStyle="#000a14"; fc.fillRect(0,0,W,H);
          // flow lines
          fc.setLineDash([4,6]); fc.strokeStyle="rgba(0,255,255,.1)"; fc.lineWidth=1.5;
          ["A","B"].forEach((n,i)=>{
            const y0=SY[n]+28, y1=(i===0?SY.B:SY.C)-28;
            fc.beginPath(); fc.moveTo(SX,y0); fc.lineTo(SX,y1); fc.stroke();
          });
          // GPU label top, Disk label bottom
          fc.setLineDash([3,5]); fc.strokeStyle="rgba(0,255,255,.08)";
          fc.beginPath(); fc.moveTo(SX,16); fc.lineTo(SX,SY.A-28); fc.stroke();
          fc.beginPath(); fc.moveTo(SX,H-16); fc.lineTo(SX,SY.C+28); fc.stroke();
          fc.setLineDash([]);
          fc.fillStyle="rgba(0,255,255,.35)"; fc.font="8px Orbitron,monospace"; fc.textAlign="center";
          fc.fillText("GPU",SX,12); fc.fillText("DISK",SX,H-4);

          // Draw slots
          for(const n of ["A","B","C"]){
            const s=slotState[n], col=SCOL[s.state]||SCOL.idle;
            const x=SX-60, y=SY[n]-24, w=120, h=48;
            fc.shadowColor=col; fc.shadowBlur=s.state==="idle"?0:14;
            fc.fillStyle=col.replace("255,","255,").replace("18)","05)");
            // simple rect fill (roundRect not always available)
            fc.fillRect(x,y,w,h);
            fc.shadowBlur=0;
            fc.strokeStyle=col; fc.lineWidth=1.5;
            fc.strokeRect(x+.75,y+.75,w-1.5,h-1.5);
            fc.fillStyle=col; fc.font="bold 12px Orbitron,monospace"; fc.textAlign="left";
            fc.fillText(n,x+8,y+18);
            fc.fillStyle="rgba(255,255,255,.45)"; fc.font="9px 'Courier New',monospace";
            fc.fillText(s.state.toUpperCase(),x+26,y+18);
            if(s.tile){ fc.fillStyle="rgba(0,255,255,.55)"; fc.fillText(s.tile,x+8,y+36); }
          }

          // Animate moving tiles
          const now=performance.now();
          for(let i=tileAnims.length-1;i>=0;i--){
            const a=tileAnims[i], p=Math.min(1,(now-a.t0)/280);
            const x=a.x0+(a.x1-a.x0)*p, y=a.y0+(a.y1-a.y0)*p;
            fc.shadowColor=a.col; fc.shadowBlur=10;
            fc.fillStyle=a.col; fc.beginPath(); fc.arc(x,y,7,0,Math.PI*2); fc.fill();
            fc.shadowBlur=0;
            fc.fillStyle="#000"; fc.font="6px 'Courier New',monospace"; fc.textAlign="center";
            fc.fillText(a.lbl||"",x,y+2);
            if(p>=1) tileAnims.splice(i,1);
          }
          fc.textAlign="left";
        }

        const ENDPOS={A:{x:SX,y:SY.A},B:{x:SX,y:SY.B},C:{x:SX,y:SY.C},
                      disk:{x:SX,y:flowCvs.height-8},gpu:{x:SX,y:8}};
        window.NotifyTileMove=function(from,to,lbl){
          const f=ENDPOS[from]||ENDPOS.disk, t=ENDPOS[to]||ENDPOS.gpu;
          tileAnims.push({x0:f.x,y0:f.y,x1:t.x,y1:t.y,t0:performance.now(),lbl:lbl||"T",col:"#ffdc00"});
        };

        // ═══════════════════════════════════════════════
        // COL 2: Dispatch waveform + Attention matrix + Error heatmap
        // ═══════════════════════════════════════════════
        const col2=document.createElement("div");
        col2.className="dbg-panel";
        col2.style.cssText="overflow:hidden;display:flex;flex-direction:column;gap:5px;";
        col2.innerHTML=`<div class="dbg-label">DISPATCH + ATTENTION</div>`;

        // Waveform
        const wvCvs=document.createElement("canvas");
        wvCvs.width=400;wvCvs.height=48;
        wvCvs.style.cssText="width:100%;background:#000;border-radius:4px;flex-shrink:0;";
        col2.appendChild(wvCvs);
        const wvCtx=wvCvs.getContext("2d");
        const wvBuf=new Array(400).fill(0);
        let wvActivity=0;

        // Dispatch bar
        const barBg=document.createElement("div");
        barBg.style.cssText="background:#020c14;border:1px solid rgba(0,255,255,.18);border-radius:4px;height:18px;overflow:hidden;flex-shrink:0;";
        const barFill=document.createElement("div");
        barFill.style.cssText="height:100%;width:0%;background:linear-gradient(90deg,#00ffaa,#00ccff);transition:width .08s;";
        barBg.appendChild(barFill); col2.appendChild(barBg);

        // Attention matrix 64×64 @ 4px/cell = 256×256
        const attnLbl=document.createElement("div");
        attnLbl.style.cssText="font-size:9px;color:rgba(0,255,255,.4);letter-spacing:1px;flex-shrink:0;";
        attnLbl.textContent="ATTENTION MATRIX [64\xD764]";
        col2.appendChild(attnLbl);

        const attnCvs=document.createElement("canvas");
        attnCvs.width=256;attnCvs.height=256;
        attnCvs.style.cssText="width:100%;border:1px solid rgba(0,255,255,.12);border-radius:4px;image-rendering:pixelated;flex:1;min-height:0;";
        col2.appendChild(attnCvs);
        const attnCtx=attnCvs.getContext("2d");
        const attnImg=attnCtx.createImageData(256,256);

        function drawAttention(mat){
          const d=attnImg.data;
          for(let r=0;r<64;r++) for(let c=0;c<64;c++){
            const v=Math.max(0,Math.min(1,mat[r*64+c]||0));
            for(let py=0;py<4;py++) for(let px=0;px<4;px++){
              const pi=((r*4+py)*256+(c*4+px))*4;
              d[pi]=0; d[pi+1]=(v*255)|0; d[pi+2]=(v*255)|0; d[pi+3]=255;
            }
          }
          attnCtx.putImageData(attnImg,0,0);
        }
        window.DrawAttention=function(arr){ drawAttention(arr); };

        // Error heatmap strip
        const errLbl=document.createElement("div");
        errLbl.style.cssText="font-size:9px;color:rgba(255,140,0,.5);letter-spacing:1px;flex-shrink:0;";
        errLbl.textContent="ERROR HEATMAP (64 recent ops)";
        col2.appendChild(errLbl);

        const errCvs=document.createElement("canvas");
        errCvs.width=256;errCvs.height=20;
        errCvs.style.cssText="width:100%;border:1px solid rgba(255,80,0,.18);border-radius:4px;image-rendering:pixelated;flex-shrink:0;";
        col2.appendChild(errCvs);
        const errCtx=errCvs.getContext("2d");
        const errBuf=new Array(64).fill(0);

        function pushErr(v){ errBuf.push(v); if(errBuf.length>64) errBuf.shift(); }
        function drawErrMap(){
          const img=errCtx.createImageData(256,20), d=img.data;
          const mx=Math.max(...errBuf,1e-10);
          for(let i=0;i<64;i++){
            const v=Math.min(1,errBuf[i]/mx);
            const r=(v*220)|0, g=((1-v)*60)|0;
            for(let y=0;y<20;y++) for(let x=0;x<4;x++){
              const pi=(y*256+i*4+x)*4;
              d[pi]=r; d[pi+1]=g; d[pi+2]=0; d[pi+3]=255;
            }
          }
          errCtx.putImageData(img,0,0);
        }

        // ═══════════════════════════════════════════════
        // COL 3: Op trace + SCXQ2 timeline
        // ═══════════════════════════════════════════════
        const col3=document.createElement("div");
        col3.className="dbg-panel";
        col3.style.cssText="overflow:hidden;display:flex;flex-direction:column;gap:5px;";
        col3.innerHTML=`<div class="dbg-label">SCXQ2 OP TRACE</div>`;

        const traceLog=document.createElement("div");
        traceLog.className="op-trace";
        traceLog.style.cssText="flex:1;min-height:0;overflow-y:auto;";
        col3.appendChild(traceLog);

        const tlLbl=document.createElement("div");
        tlLbl.style.cssText="font-size:9px;color:rgba(0,255,255,.4);letter-spacing:1px;flex-shrink:0;";
        tlLbl.textContent="TIMELINE";
        col3.appendChild(tlLbl);

        const tlCvs=document.createElement("canvas");
        tlCvs.width=400;tlCvs.height=36;
        tlCvs.style.cssText="width:100%;border:1px solid rgba(0,255,255,.1);border-radius:4px;background:#000;flex-shrink:0;";
        col3.appendChild(tlCvs);
        const tlCtx=tlCvs.getContext("2d");
        const tlBuf=[];
        const OPCOL={LOAD_Q:"#4499ff",LOAD_K:"#44aaff",LOAD_V:"#44ccff",
          QK_DOT:"#ff9944",SOFTMAX:"#ffcc44",PV_MUL:"#44ffaa",
          ATTN_FUSED:"#ff44ff",STORE:"#aaffaa",LAYER_FOLD:"#ffff44"};

        function pushTimeline(op,ms){
          tlBuf.push({op,ms:ms||30,col:OPCOL[op]||"#0ff"});
          if(tlBuf.length>48) tlBuf.shift();
        }
        function drawTimeline(){
          const W=tlCvs.width,H=tlCvs.height;
          tlCtx.fillStyle="#000"; tlCtx.fillRect(0,0,W,H);
          if(!tlBuf.length) return;
          const total=tlBuf.reduce((s,b)=>s+b.ms,0)||1;
          let x=0;
          for(const b of tlBuf){
            const w=Math.max(3,(b.ms/total)*W);
            tlCtx.fillStyle=b.col; tlCtx.fillRect(x,3,w-1,H-6);
            if(w>16){ tlCtx.fillStyle="#000"; tlCtx.font="7px 'Courier New',monospace";
              tlCtx.fillText(b.op.slice(0,5),x+2,H/2+3); }
            x+=w;
          }
        }

        function emitTrace(opCode,detail,err){
          const t=new Date().toISOString().substr(11,8);
          const fused=opCode==="ATTN_FUSED";
          const line=document.createElement("div"); line.className="op-line";
          if(fused) line.style.cssText="background:rgba(255,0,255,.07);border-bottom:1px solid rgba(255,0,255,.12);";
          line.innerHTML=`<span class="op-ts">${t}</span>`+
            `<span class="op-code" style="${fused?"color:#ff55ff":""}">${opCode}${fused?" \u27C1":""}</span>`+
            `<span class="op-detail">${detail||""}</span>`+
            (err!=null?`<span class="op-err">err=${typeof err==="number"?err.toExponential(2):err}</span>`:"");
          traceLog.appendChild(line);
          if(traceLog.children.length>300) traceLog.removeChild(traceLog.firstChild);
          traceLog.scrollTop=traceLog.scrollHeight;
        }

        // ── Window bridge hooks ────────────────────────────────────────────────
        window.GPU_ACTIVITY=function(v){
          wvActivity=Math.max(0,Math.min(1,v));
          barFill.style.width=(wvActivity*100)+"%";
        };
        window.EmitToUI=function(opStr){
          const m=opStr.match(/^(\S+)\s*(.*?)(?:\s+err=(\S+?))?(?:\s+ms=(\S+?))?$/);
          if(m){
            const err=m[3]!=null?parseFloat(m[3]):null;
            const ms=m[4]!=null?parseFloat(m[4]):30;
            emitTrace(m[1],m[2]||"",err);
            if(err!=null) pushErr(err);
            pushTimeline(m[1],ms);
          } else emitTrace(opStr,"",null);
        };

        // ASX_SLOTS polling watcher
        const slotWatcher=setInterval(()=>{
          const sl=window.ASX_SLOTS;
          if(!sl||typeof sl!=="object") return;
          ["A","B","C"].forEach(n=>{ if(sl[n]) setSlot(n,sl[n],sl.tiles?.[n]||""); });
          const s=sl.stats||{};
          const $=id=>document.getElementById(id);
          const fmt=(v,fn)=>v!=null?fn(v):"—";
          if($("pb-gpu"))  $("pb-gpu").textContent=fmt(s.gpu_ms,v=>v.toFixed(1));
          if($("pb-disk")) $("pb-disk").textContent=fmt(s.disk_ms,v=>v.toFixed(1));
          if($("pb-thr"))  $("pb-thr").textContent=fmt(s.thr_hps,v=>v.toFixed(1));
          if($("pb-err"))  $("pb-err").textContent=fmt(s.max_err,v=>v.toExponential(2));
          if($("pb-io") && s.gpu_ms!=null && s.disk_ms!=null){
            const total=s.gpu_ms+s.disk_ms;
            $("pb-io").textContent=total>0?((s.gpu_ms/total)*100).toFixed(0):"—";
          }
        },80);

        // ── Demo ticker ────────────────────────────────────────────────────────
        const DEMO_OPS=["LOAD_Q","LOAD_K","LOAD_V","QK_DOT","SOFTMAX","PV_MUL","STORE","LAYER_FOLD"];
        const DEMO_CYCLE=[
          {A:"idle",  B:"load",   C:"idle",   mv:["disk","C"]},
          {A:"idle",  B:"load",   C:"prefetch",mv:["C","B"]},
          {A:"compute",B:"idle",  C:"load",   mv:["B","A"]},
          {A:"compute",B:"prefetch",C:"idle", mv:["A","gpu"]},
          {A:"idle",  B:"compute",C:"load",   mv:["C","B"]},
        ];
        let ph=0,dHead=0,dLayer=0;
        const demoAttn=new Float32Array(4096);

        const demoTick=setInterval(()=>{
          if(window.ASX_SLOTS) return;
          if(window.dbg&&window.dbg.mode==="pause") return;
          const cyc=DEMO_CYCLE[ph%DEMO_CYCLE.length];
          ["A","B","C"].forEach(n=>setSlot(n,cyc[n]||"idle",
            cyc[n]==="idle"?"":("h"+dHead+"/t"+(ph%16))));
          if(cyc.mv) window.NotifyTileMove(cyc.mv[0],cyc.mv[1],"T"+(ph%16));
          const computing=cyc.A==="compute"||cyc.B==="compute";
          const act=computing?0.6+Math.random()*0.4:Math.random()*0.1;
          window.GPU_ACTIVITY(act);
          if(computing){
            // Synthetic causal attention
            for(let r=0;r<64;r++){
              let sum=0;
              for(let c=0;c<64;c++){
                const v=c<=r?Math.exp(-(r-c)*0.12+Math.random()*0.25):0;
                demoAttn[r*64+c]=v; sum+=v;
              }
              if(sum>0) for(let c=0;c<64;c++) demoAttn[r*64+c]/=sum;
            }
            drawAttention(demoAttn);
            const op=demoFused?"ATTN_FUSED":DEMO_OPS[ph%DEMO_OPS.length];
            const err=1.49e-8+(Math.random()-0.5)*2e-9;
            const ms=28+Math.random()*10;
            window.EmitToUI(`${op} layer=${dLayer} head=${dHead} err=${err.toExponential(3)} ms=${ms.toFixed(1)}`);
            if(window.dbg&&window.dbg.mode==="step") window.dbg.pause();
            dHead=(dHead+1)%16;
            if(dHead===0) dLayer=(dLayer+1)%24;
          }
          ph++;
        },420);

        // ── Render loop ────────────────────────────────────────────────────────
        const wvLoop=setInterval(()=>{
          wvBuf.push(wvActivity); if(wvBuf.length>400) wvBuf.shift();
          // Waveform
          const W=wvCvs.width,H=wvCvs.height;
          wvCtx.fillStyle="#000"; wvCtx.fillRect(0,0,W,H);
          wvCtx.beginPath(); wvCtx.strokeStyle="#00ffaa"; wvCtx.lineWidth=1.5;
          for(let i=0;i<wvBuf.length;i++){
            const x=i,y=H-wvBuf[i]*(H-4)-2;
            i===0?wvCtx.moveTo(x,y):wvCtx.lineTo(x,y);
          }
          wvCtx.stroke();
          wvCtx.strokeStyle="rgba(0,255,255,.06)"; wvCtx.lineWidth=1;
          for(let y=0;y<H;y+=12){wvCtx.beginPath();wvCtx.moveTo(0,y);wvCtx.lineTo(W,y);wvCtx.stroke();}
          // Flow canvas + heatmap + timeline
          drawFlowCanvas(); drawErrMap(); drawTimeline();
        },50);

        // ── Assemble ───────────────────────────────────────────────────────────
        layout.append(col1,col2,col3);
        root.append(ctrlBar,layout);

        // ── Cleanup ────────────────────────────────────────────────────────────
        const observer=new MutationObserver(()=>{
          if(!root.isConnected){
            clearInterval(demoTick);clearInterval(wvLoop);clearInterval(slotWatcher);
            delete window.GPU_ACTIVITY;delete window.EmitToUI;
            delete window.DrawAttention;delete window.NotifyTileMove;delete window.dbg;
            observer.disconnect();
          }
        });
        observer.observe(root,{childList:true});
      }
    }

    window.addEventListener("DOMContentLoaded",()=>{
      window.KUHUL = new KuhulCore(XJSON_BOOT);
    });
  </script>

  <!-- PRIMEOS AGENT SPAWNER - K'UHUL MICRONAUT FACTORY (frontend demo wiring) -->
  <script>
  // PRIMEOS AGENT SPAWNER - Spawn specialized agents with mini-OS runtimes

  const MicronautFactory = {
    async spawnTopicAgent(topic, userRequirements = {}) {
      const agentId = `micronaut_${topic.toLowerCase().replace(/\s+/g, '_')}_${Date.now()}`;
      const miniOS = await this.generateMiniOS(topic, userRequirements);
      const runtime = await this.createAgentRuntime(agentId, miniOS);
      // In this frontend demo, KuhulKernel is not a real process manager,
      // but we keep the ritual string to preserve your glyph contract.
      const process = { pid: agentId, context:{topic,miniOS,runtime}, status:"demo" };
      return {
        agentId,
        topic,
        miniOS,
        runtime,
        processId: process.pid,
        endpoints: this.generateAgentEndpoints(agentId),
        status: 'active'
      };
    },

    async generateMiniOS(topic, requirements) {
      return {
        "Ωv": "1.0",
        "name": `${topic} Micronaut`,
        "type": "specialized_agent",
        "topic": topic,
        "capabilities": this.deriveCapabilities(topic, requirements),

        "⟁kproc": {
          "⟁data_ingest": { "⟁sources": ["web", "apis", "files"], "⟁format": ["json", "html", "text"] },
          "⟁analysis": { "⟁tools": ["pattern_matching", "summarization", "trend_detection"] },
          "⟁output": { "⟁formats": ["api", "ui", "report", "alert"] }
        },

        "⟁endpoints": {
          "⟁ingest": `/api/agents/${topic}/ingest`,
          "⟁query": `/api/agents/${topic}/query`,
          "⟁train": `/api/agents/${topic}/train`,
          "⟁export": `/api/agents/${topic}/export`
        },

        "⟁ui_components": this.generateUIComponents(topic),
        "⟁data_schema": await this.generateDataSchema(topic),
        "⟁training_loop": requirements.training ? this.generateTrainingLoop(topic) : null
      };
    },

    async createAgentRuntime(agentId, miniOS) {
      const runtime = {
        id: agentId,
        memory: new Map(),
        data: new Map(),
        models: new Map(),
        active: true,
        createdAt: Date.now()
      };
      return runtime;
    },

    deriveCapabilities(topic, requirements) {
      const baseCapabilities = ["data_ingestion", "query_processing", "basic_analysis"];
      const topicSpecific = this.getTopicSpecificCapabilities(topic);
      const requirementBased = this.getRequirementCapabilities(requirements);
      return [...baseCapabilities, ...topicSpecific, ...requirementBased];
    },

    getTopicSpecificCapabilities(topic) {
      const topicMap = {
        'baseball': ['statistics_analysis', 'player_comparison', 'game_prediction'],
        'cooking': ['recipe_analysis', 'ingredient_substitution', 'nutrition_calculation'],
        'finance': ['market_analysis', 'trend_prediction', 'portfolio_suggestions'],
        'research': ['paper_analysis', 'citation_tracking', 'summary_generation'],
        'scraping': ['web_crawling', 'data_extraction', 'content_parsing'],
        'training': ['model_training', 'hyperparameter_tuning', 'performance_evaluation']
      };
      return topicMap[topic.toLowerCase()] || ['topic_analysis', 'pattern_recognition'];
    },

    getRequirementCapabilities(requirements){
      const caps=[];
      if(requirements.capabilities) caps.push(...requirements.capabilities);
      if(requirements.training) caps.push("training_loop");
      return caps;
    },

    generateUIComponents(topic){
      return [
        { id:"dashboard", kind:"panel", label:`${topic} Dashboard`},
        { id:"logs", kind:"panel", label:"Agent Logs"},
        { id:"config", kind:"panel", label:"Config"}
      ];
    },

    async generateDataSchema(topic){
      return {
        topic,
        fields:[
          {name:"title", selector:"<title>(.*?)</title>"},
          {name:"body_snippet", selector:"<body[^>]*>([\\s\\S]{0,500})"}
        ]
      };
    },

    generateTrainingLoop(topic){
      return {
        strategy:"qlora",
        schedule:"offline",
        notes:`Training loop for ${topic} micronaut`
      };
    },

    generateAgentEndpoints(agentId) {
      return {
        "control": `/api/agents/${agentId}/control`,
        "ingest": `/api/agents/${agentId}/ingest`,
        "query": `/api/agents/${agentId}/query`,
        "train": `/api/agents/${agentId}/train`,
        "status": `/api/agents/${agentId}/status`,
        "export": `/api/agents/${agentId}/export`
      };
    }
  };

  console.log("PRIMEOS AGENT SPAWNING SYSTEM - K'UHUL MICRONAUT FACTORY ACTIVE (FRONTEND DEMO)");
  </script>
