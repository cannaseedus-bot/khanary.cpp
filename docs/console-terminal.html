<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASX Thread-Process-Executor · JSON Automation OS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c12;
      color: #16f2aa;
      font-family: 'Courier New', 'Fira Code', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #05070c;
      border-bottom: 1px solid #16f2aa33;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #16f2aa33;
      overflow: hidden;
    }
    .panel:last-child { border-right: none; }
    .panel-header {
      background: #05070c;
      padding: 10px;
      border-bottom: 1px solid #16f2aa33;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: 11px;
    }
    .thread-card, .process-card, .executor-card {
      background: #0f121c;
      border: 1px solid #16f2aa33;
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .thread-card:hover, .process-card:hover, .executor-card:hover {
      border-color: #16f2aa;
      background: #16f2aa10;
    }
    .thread-card.active { border-left: 4px solid #16f2aa; }
    .message-item {
      padding: 6px;
      margin: 4px 0;
      border-left: 2px solid;
      background: #0a0c12;
    }
    .message-user { border-left-color: #44ff66; }
    .message-system { border-left-color: #16f2aa; }
    .message-log { border-left-color: #ffaa44; }
    .step-item {
      padding: 6px;
      margin: 4px 0;
      border-radius: 4px;
    }
    .step-completed { background: #16f2aa10; color: #44ff66; }
    .step-in-progress { background: #ffaa4410; color: #ffaa44; border-left: 2px solid #ffaa44; }
    .step-pending { opacity: 0.5; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      margin-left: 6px;
    }
    .badge-active { background: #44ff66; color: #0a0c12; }
    .badge-completed { background: #16f2aa; color: #0a0c12; }
    .badge-in-progress { background: #ffaa44; color: #0a0c12; }
    button {
      background: #16f2aa20;
      border: 1px solid #16f2aa;
      color: #16f2aa;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 10px;
    }
    button:hover { background: #16f2aa40; }
    .log-console {
      background: #05070c;
      height: 150px;
      overflow-y: auto;
      padding: 8px;
      font-size: 10px;
      border-top: 1px solid #16f2aa33;
    }
    .log-line {
      padding: 2px 0;
      font-family: monospace;
    }
    .status-bar {
      background: #05070c;
      border-top: 1px solid #16f2aa33;
      padding: 6px 12px;
      font-size: 10px;
      display: flex;
      gap: 20px;
    }
    input, textarea, select {
      background: #0f121c;
      border: 1px solid #16f2aa33;
      color: #16f2aa;
      padding: 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }
    .message-input {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-top: 1px solid #16f2aa33;
    }
    .message-input input {
      flex: 1;
    }
  </style>
</head>
<body>

<div class="header">
  <div>⚡ ASX Thread-Process-Executor · JSON Automation OS</div>
  <div style="display: flex; gap: 8px;">
    <button id="startAllBtn">▶ START ALL</button>
    <button id="pauseAllBtn">⏸ PAUSE ALL</button>
    <button id="resetBtn">🔄 RESET</button>
  </div>
</div>

<div class="main">
  <!-- THREAD PANEL -->
  <div class="panel">
    <div class="panel-header">
      <span>💬 THREADS (Communication)</span>
      <span id="threadCount">0</span>
    </div>
    <div class="panel-content" id="threadPanel"></div>
    <div class="message-input">
      <input type="text" id="newMessageInput" placeholder="Send message to active thread..." />
      <button id="sendMessageBtn">📨 SEND</button>
    </div>
  </div>

  <!-- PROCESS PANEL -->
  <div class="panel">
    <div class="panel-header">
      <span>⚙️ PROCESSES (Workflows)</span>
      <span id="processCount">0</span>
    </div>
    <div class="panel-content" id="processPanel"></div>
  </div>

  <!-- EXECUTOR PANEL -->
  <div class="panel">
    <div class="panel-header">
      <span>🔧 EXECUTORS (Runners)</span>
      <span id="executorCount">0</span>
    </div>
    <div class="panel-content" id="executorPanel"></div>
  </div>
</div>

<div class="log-console" id="logConsole">
  <div class="log-line">⚡ ASX Runtime initialized</div>
  <div class="log-line">📡 Thread-Process-Executor architecture active</div>
</div>

<div class="status-bar">
  <span>📊 Overall: <span id="overallStatus">IDLE</span></span>
  <span>🧵 Active Threads: <span id="activeThreads">0</span></span>
  <span>⚙️ Running Processes: <span id="runningProcesses">0</span></span>
  <span>🔧 Busy Executors: <span id="busyExecutors">0</span></span>
</div>

<script>
// ============================================================
// ASX THREAD-PROCESS-EXECUTOR RUNTIME
// Complete JSON-driven automation system
// ============================================================

// ==================== DATA MODELS ====================

// Thread Data (from first JSON)
const threadData = {

// Process Data (from second JSON)
const processData = {
  process_id: "proc_build_deploy_20260422",
  name: "Build and Deploy Workflow",
  description: "Automated process for building and deploying a software application.",
  created_at: "2026-04-22T12:00:00Z",

    },
    {

      status: "pending",

    }
  ],
  current_step: "step_5",
  overall_status: "in_progress",
  metadata: { owner: "dev_team", priority: "high" }
};

// Processor/Trigger (from third JSON)
const processorData = {
  processor_id: "thread_processor_1",
  name: "Thread Event Handler",
  description: "Monitors the thread for new messages and triggers process steps.",
  rules: [
    {
      trigger: { thread_id: "thr_abc123xyz456", message_type: "text", content_contains: "Starting the build process" },
      action: { target_process: "proc_build_deploy_20260422", step_id: "step_1", command: "start" }
    },
    {
      trigger: { thread_id: "thr_abc123xyz456", message_type: "log", content_contains: "Build completed successfully" },
      action: { target_process: "proc_build_deploy_20260422", step_id: "step_5", command: "start" }
    }
  ],
  on_error: { notify: "admin@example.com", retry_after: 300 }
};

// Executor (from fourth JSON)
const executorData = {
  executor_id: "process_executor_1",
  name: "Process Step Runner",
  description: "Executes steps in the process and updates the thread with results.",
  handlers: [
    {
      process_id: "proc_build_deploy_20260422",
      step_id: "step_1",
      script: "/scripts/checkout_source.sh",
      on_success: {
        update_thread: {
          thread_id: "thr_abc123xyz456",
          message: { sender: "system", content: { type: "log", body: "Source code checked out successfully." } }
        },
        next_step: "step_2"
      },
      on_failure: { update_thread: { thread_id: "thr_abc123xyz456", message: { sender: "system", content: { type: "log", body: "Failed to check out source code. Retrying..." } } }, retry: true }
    },
    {
      process_id: "proc_build_deploy_20260422",
      step_id: "step_5",
      script: "/scripts/deploy.sh",
      on_success: {
        update_thread: {
          thread_id: "thr_abc123xyz456",
          message: { sender: "system", content: { type: "log", body: "Deployment completed. Application is live at https://staging.example.com." } }
        }
      }
    }
  ],
  on_error: { notify: "admin@example.com", pause_process: true }
};

// ==================== RUNTIME STATE ====================

let threads = new Map();
let processes = new Map();
let executors = new Map();
let activeTriggers = [];
let runtimeRunning = true;
let logEntries = [];

function addLog(message, type = 'info') {
  const timestamp = new Date().toLocaleTimeString();
  const logLine = { timestamp, message, type };
  logEntries.push(logLine);
  const logDiv = document.getElementById('logConsole');
  const line = document.createElement('div');
  line.className = `log-line`;
  line.style.color = type === 'error' ? '#ff6688' : type === 'success' ? '#44ff66' : '#88ffcc';
  line.textContent = `[${timestamp}] ${message}`;
  logDiv.appendChild(line);
  logDiv.scrollTop = logDiv.scrollHeight;
  if (logEntries.length > 100) logEntries.shift();
}

// ==================== THREAD MANAGER ====================

class ThreadManager {
  constructor(data) {
    this.data = data;
    this.listeners = [];
  }
  
  addMessage(sender, content, type = 'text') {
    const message = {
      id: `msg_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
      sender: sender,
      timestamp: new Date().toISOString(),
      content: { type: type, body: content },
      metadata: { status: "sent" }
    };
    this.data.messages.push(message);
    addLog(`[THREAD:${this.data.thread_id}] ${sender}: ${content.substring(0, 80)}`, 'info');
    this.processTriggers(message);
    this.render();
    return message;
  }
  
  processTriggers(message) {
    for (const rule of processorData.rules) {
      if (rule.trigger.thread_id === this.data.thread_id) {
        if (rule.trigger.message_type === message.content.type) {
          if (!rule.trigger.content_contains || message.content.body.includes(rule.trigger.content_contains)) {
            addLog(`🎯 Trigger matched: ${rule.action.command} on ${rule.action.target_process}:${rule.action.step_id}`, 'success');
            this.executeAction(rule.action);
          }
        }
      }
    }
  }
  
  executeAction(action) {
    const process = processes.get(action.target_process);
    if (process && action.command === 'start') {
      process.startStep(action.step_id);
    }
  }
  
  render() {
    const container = document.getElementById('threadPanel');
    if (!container) return;
    
    let html = `<div class="thread-card active">
      <div><strong>${this.data.title}</strong> <span class="badge badge-active">${this.data.status}</span></div>
      <div style="font-size:9px; color:#888;">ID: ${this.data.thread_id}</div>
      <div style="margin-top:8px;"><strong>Messages (${this.data.messages.length}):</strong></div>`;
    
    for (const msg of this.data.messages.slice(-10)) {
      const senderClass = msg.sender === 'user_1' ? 'message-user' : (msg.content.type === 'log' ? 'message-log' : 'message-system');
      html += `<div class="message-item ${senderClass}">
        <strong>${msg.sender === 'user_1' ? '👤 Alice' : '🤖 System'}</strong> 
        <span style="font-size:9px;">${new Date(msg.timestamp).toLocaleTimeString()}</span><br>
        ${msg.content.body.substring(0, 100)}
      </div>`;
    }
    
    html += `</div>`;
    container.innerHTML = html;
  }
}

// ==================== PROCESS MANAGER ====================

class ProcessManager {
  constructor(data) {
    this.data = data;
    this.currentStepIndex = this.data.steps.findIndex(s => s.step_id === this.data.current_step);
    if (this.currentStepIndex === -1) this.currentStepIndex = 0;
  }
  
  startStep(stepId) {
    const step = this.data.steps.find(s => s.step_id === stepId);
    if (!step) return;
    if (step.status === 'completed') return;
    
    step.status = 'in_progress';
    step.started_at = new Date().toISOString();
    this.data.overall_status = 'in_progress';
    addLog(`[PROCESS:${this.data.process_id}] Starting step: ${step.name}`, 'info');
    
    // Find executor for this step
    const executor = Array.from(executors.values()).find(e => 
      e.handlers.some(h => h.process_id === this.data.process_id && h.step_id === stepId)
    );
    
    if (executor) {
      executor.executeStep(this.data.process_id, stepId);
    } else {
      // Simulate execution
      setTimeout(() => {
        step.status = 'completed';
        step.completed_at = new Date().toISOString();
        addLog(`[PROCESS:${this.data.process_id}] Step completed: ${step.name}`, 'success');
        this.render();
        
        // Find next step
        const nextIndex = this.data.steps.findIndex(s => s.step_id === stepId) + 1;
        if (nextIndex < this.data.steps.length) {
          this.data.current_step = this.data.steps[nextIndex].step_id;
          this.startStep(this.data.current_step);
        } else {
          this.data.overall_status = 'completed';
          addLog(`[PROCESS:${this.data.process_id}] All steps completed!`, 'success');
        }
        this.render();
      }, 2000);
    }
    
    this.render();
  }
  
  render() {
    const container = document.getElementById('processPanel');
    if (!container) return;
    
    const statusClass = this.data.overall_status === 'completed' ? 'badge-completed' : 'badge-in-progress';
    let html = `<div class="process-card">
      <div><strong>${this.data.name}</strong> <span class="badge ${statusClass}">${this.data.overall_status}</span></div>
      <div style="font-size:9px; color:#888;">${this.data.process_id}</div>
      <div style="margin-top:8px;"><strong>Steps:</strong></div>`;
    
    for (const step of this.data.steps) {
      let stepClass = 'step-pending';
      if (step.status === 'completed') stepClass = 'step-completed';
      if (step.status === 'in_progress') stepClass = 'step-in-progress';
      
      html += `<div class="step-item ${stepClass}">
        <strong>${step.name}</strong> 
        ${step.status === 'completed' ? '✅' : step.status === 'in_progress' ? '⏳' : '⭕'}
        <div style="font-size:9px;">${step.description}</div>
        ${step.output ? `<div style="font-size:8px; color:#888;">Output: ${JSON.stringify(step.output).substring(0, 80)}</div>` : ''}
      </div>`;
    }
    
    html += `</div>`;
    container.innerHTML = html;
  }
}

// ==================== EXECUTOR MANAGER ====================

class ExecutorManager {
  constructor(data) {
    this.data = data;
    this.busy = false;
    this.executionQueue = [];
  }
  
  async executeStep(processId, stepId) {
    const handler = this.data.handlers.find(h => h.process_id === processId && h.step_id === stepId);
    if (!handler) {
      addLog(`[EXECUTOR:${this.data.executor_id}] No handler for ${processId}:${stepId}`, 'error');
      return;
    }
    
    this.busy = true;
    addLog(`[EXECUTOR:${this.data.executor_id}] Executing: ${handler.script}`, 'info');
    this.updateUI();
    
    // Simulate script execution
    await new Promise(resolve => setTimeout(resolve, 1500));
    
    // Simulate success (90% success rate)
    const success = Math.random() < 0.9;
    
    if (success && handler.on_success) {
      addLog(`[EXECUTOR:${this.data.executor_id}] Script succeeded`, 'success');
      
      // Update thread with success message
      if (handler.on_success.update_thread) {
        const thread = threads.get(handler.on_success.update_thread.thread_id);
        if (thread) {
          const msg = handler.on_success.update_thread.message;
          thread.addMessage(msg.sender, msg.content.body, msg.content.type);
        }
      }
      
      // Update process step status
      const process = processes.get(processId);
      if (process) {
        const step = process.data.steps.find(s => s.step_id === stepId);
        if (step) {
          step.status = 'completed';
          step.completed_at = new Date().toISOString();
          addLog(`[PROCESS] Step ${stepId} completed via executor`, 'success');
        }
      }
      
      // Trigger next step
      if (handler.on_success.next_step) {
        const process = processes.get(processId);
        if (process) {
          process.data.current_step = handler.on_success.next_step;
          process.startStep(handler.on_success.next_step);
        }
      }
    } else if (handler.on_failure) {
      addLog(`[EXECUTOR:${this.data.executor_id}] Script failed`, 'error');
      
      if (handler.on_failure.update_thread) {
        const thread = threads.get(handler.on_failure.update_thread.thread_id);
        if (thread) {
          const msg = handler.on_failure.update_thread.message;
          thread.addMessage(msg.sender, msg.content.body, msg.content.type);
        }
      }
      
      if (handler.on_failure.retry) {
        addLog(`[EXECUTOR:${this.data.executor_id}] Retrying in 2 seconds...`, 'warning');
        setTimeout(() => this.executeStep(processId, stepId), 2000);
      }
    }
    
    this.busy = false;
    this.updateUI();
    
    // Process next in queue
    if (this.executionQueue.length > 0) {
      const next = this.executionQueue.shift();
      this.executeStep(next.processId, next.stepId);
    }
  }
  
  updateUI() {
    const container = document.getElementById('executorPanel');
    if (!container) return;
    
    const statusText = this.busy ? '🔧 BUSY' : '✅ IDLE';
    let html = `<div class="executor-card">
      <div><strong>${this.data.name}</strong> <span class="badge ${this.busy ? 'badge-in-progress' : 'badge-completed'}">${this.busy ? 'RUNNING' : 'READY'}</span></div>
      <div style="font-size:9px;">ID: ${this.data.executor_id}</div>
      <div style="margin-top:8px;"><strong>Handlers:</strong></div>`;
    
    for (const handler of this.data.handlers) {
      html += `<div style="font-size:10px; margin:4px 0;">
        📜 ${handler.process_id}:${handler.step_id} → ${handler.script}
      </div>`;
    }
    
    html += `<div style="margin-top:8px; font-size:10px; color:#888;">Status: ${statusText}</div>`;
    html += `</div>`;
    container.innerHTML = html;
  }
  
  render() { this.updateUI(); }
}

// ==================== INITIALIZATION ====================

function initialize() {
  addLog('🚀 Initializing ASX Thread-Process-Executor Runtime...', 'info');
  
  // Create Thread
  const thread = new ThreadManager(JSON.parse(JSON.stringify(threadData)));
  threads.set(thread.data.thread_id, thread);
  
  // Create Process
  const process = new ProcessManager(JSON.parse(JSON.stringify(processData)));
  processes.set(process.data.process_id, process);
  
  // Create Executor
  const executor = new ExecutorManager(JSON.parse(JSON.stringify(executorData)));
  executors.set(executor.data.executor_id, executor);
  
  // Render all
  thread.render();
  process.render();
  executor.render();
  
  // Update stats
  document.getElementById('threadCount').innerText = threads.size;
  document.getElementById('processCount').innerText = processes.size;
  document.getElementById('executorCount').innerText = executors.size;
  document.getElementById('activeThreads').innerText = threads.size;
  document.getElementById('runningProcesses').innerText = Array.from(processes.values()).filter(p => p.data.overall_status === 'in_progress').length;
  document.getElementById('busyExecutors').innerText = Array.from(executors.values()).filter(e => e.busy).length;
  document.getElementById('overallStatus').innerText = 'RUNNING';
  
  addLog('✅ Runtime initialized. Thread-Process-Executor architecture active.', 'success');
}

// ==================== UI CONTROLS ====================

document.getElementById('sendMessageBtn').addEventListener('click', () => {
  const input = document.getElementById('newMessageInput');
  const message = input.value.trim();
  if (message && threads.size > 0) {
    const thread = threads.values().next().value;
    thread.addMessage('user_1', message, 'text');
    input.value = '';
  }
});

document.getElementById('newMessageInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('sendMessageBtn').click();
  }
});

document.getElementById('startAllBtn').addEventListener('click', () => {
  addLog('▶ Starting all processes...', 'info');
  for (const process of processes.values()) {
    if (process.data.overall_status !== 'completed') {
      process.startStep(process.data.current_step);
    }
  }
});

document.getElementById('pauseAllBtn').addEventListener('click', () => {
  addLog('⏸ Pausing runtime...', 'warning');
  runtimeRunning = false;
  document.getElementById('overallStatus').innerText = 'PAUSED';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  addLog('🔄 Resetting runtime...', 'warning');
  threads.clear();
  processes.clear();
  executors.clear();
  initialize();
  runtimeRunning = true;
});

// Auto-start on load
initialize();

// Periodic status updates
setInterval(() => {
  if (runtimeRunning) {
    document.getElementById('runningProcesses').innerText = Array.from(processes.values()).filter(p => p.data.overall_status === 'in_progress').length;
    document.getElementById('busyExecutors').innerText = Array.from(executors.values()).filter(e => e.busy).length;
  }
}, 500);
</script>
</body>
